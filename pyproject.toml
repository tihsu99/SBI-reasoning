[project]
name = "sbi-reasoning"
version = "0.1.0"
description = "Toy data-profile-guided neutrino reconstruction with DGPO"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "matplotlib>=3.9",
    "numpy>=2.0",
    "pyyaml>=6.0",
    "scipy>=1.14",
    "torch>=2.4,<2.9",
    "python-dotenv>=1.0",
    "wandb>=0.22",
]

[project.scripts]
sbi-toy = "sbi_reasoning.pipeline:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["sbi_reasoning"]
