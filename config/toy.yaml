seed: 240513
output_dir: /pscratch/sd/t/tihsu/database/SBI-reasoning/toy-model

data:
  template_masses_gev: [400.0, 500.0, 600.0]
  real_masses_gev:
    start: 400.0
    stop: 600.0
    step: 25.0
  template_events_per_mass: 100000
  real_events_per_mass: 100000
  validation_fraction: 0.2

experiments:
  enabled: [mass]

physics:
  parent_momentum:
    distribution: double_exponential
    center_gev: 300.0
    scale_gev: 45.0
  lepton_mass_gev: 0.0
  neutrino_mass_gev: 0.0
  lepton_relative_resolution: 0.02
  met_resolution_gev: 5.0

model:
  profiler_type: mass_parameterized_ratio  # Set to template_classifier for the legacy mode.
  hidden_dims: [128, 256, 128]
  time_embedding_dim: 16

training:
  device: auto
  mixed_precision: none
  batch_size: 2048
  profiler_epochs: 100
  profiler_learning_rate: 0.003
  flow_epochs: 100
  flow_learning_rate: 0.003
  weight_decay: 0.0001

sampling:
  ode_steps: 20
  output_clip_sigma: 6.0

dgpo:
  scope: independent_per_pseudo_data
  iterations_per_pseudo_data: 1000
  batch_size: 1024
  group_size: 4
  condition_sampling: balanced
  learning_rate: 0.0001
  beta: 10.0
  kl_beta: 0.01
  minimum_timestep: 0.3
  gradient_clip: 1.0
  profile_estimator_scale_gev: 100.0
  estimator_gap_tolerance_gev: 5.0
  estimator_gap_patience: 10
  reward_spread_threshold: 0.00001
  reward_spread_patience: 25
  minimum_iterations: 25
  log_every: 25

evaluation:
  profile_scan_masses_gev:
    start: 400.0
    stop: 600.0
    step: 5.0
  batch_size: 1024
  histogram_bins: 80
  mass_range_gev: [0.0, 1200.0]
  profile_minimum_accuracy_above_chance: 0.05
  profile_fail_on_invalid: true

figures:
  style: nature
  width_inches: 7.2
  raster_dpi: 600
  preview_dpi: 300
  formats: [svg, pdf, tiff, png]
  likelihood_masses_gev: [400.0, 500.0, 600.0]
  momentum_diagnostic_mass_gev: 500.0
  momentum_scatter_points: 2000
  sbi_input_histogram_bins: 60
  sbi_input_quantile_range: [0.005, 0.995]

logging:
  wandb:
    enabled: false
    mode: offline
    project: sbi-reasoning
    entity: null
    group: mass-only-400-500-600-momentum
    name: null
    tags: [toy-model, mass-only, dgpo, neutrino-reconstruction]
