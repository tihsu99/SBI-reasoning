seed: 240513
output_dir: /pscratch/sd/t/tihsu/database/SBI-reasoning

data:
  template_masses_gev: [300.0, 500.0, 700.0]
  real_masses_gev:
    start: 300.0
    stop: 700.0
    step: 25.0
  template_events_per_mass: 200000
  real_events_per_mass: 50000
  validation_fraction: 0.2

experiments:
  jes_template_shifts: [-0.10, 0.0, 0.10]
  jet_energy_scale:
    parent_mass_gev: 500.0
    real_shifts: [-0.10, -0.075, -0.05, -0.025, 0.0, 0.025, 0.05, 0.075, 0.10]
  mass_jes_grid:
    evaluation_jes_shifts: [-0.10, -0.05, 0.0, 0.05, 0.10]
    benchmark_points:
      - {mass_gev: 350.0, jes_shift: -0.05}
      - {mass_gev: 500.0, jes_shift: 0.0}
      - {mass_gev: 650.0, jes_shift: 0.05}

physics:
  parent_energy:
    distribution: double_exponential
    center_gev: 1000.0
    scale_gev: 150.0
  lepton_mass_gev: 0.1
  neutrino_mass_gev: 0.0
  lepton_relative_resolution: 0.02
  met_resolution_gev: 5.0

model:
  hidden_dims: [256, 256, 128]
  time_embedding_dim: 32

training:
  device: cuda
  mixed_precision: bf16
  batch_size: 4096
  profiler_epochs: 200
  profiler_learning_rate: 0.001
  flow_epochs: 200
  flow_learning_rate: 0.001
  weight_decay: 0.0001

sampling:
  ode_steps: 30
  output_clip_sigma: 6.0

dgpo:
  iterations: 10000
  batch_size: 512
  group_size: 4
  condition_sampling: balanced
  learning_rate: 0.0001
  beta: 10.0
  kl_beta: 0.01
  minimum_timestep: 0.3
  gradient_clip: 1.0
  profile_mass_scale_gev: 50.0
  log_every: 25

evaluation:
  batch_size: 4096
  histogram_bins: 100
  mass_range_gev: [0.0, 1200.0]

figures:
  style: nature
  width_inches: 7.2
  raster_dpi: 600
  preview_dpi: 300
  formats: [svg, pdf, tiff, png]
  likelihood_masses_gev: [300.0, 350.0, 500.0, 650.0, 700.0]
  reconstruction_heatmap_methods: [baseline, sft, dgpo, oracle]

logging:
  wandb:
    enabled: true
    mode: online
    project: sbi-reasoning
    entity: ytchou97-university-of-washington
    group: mass-jes-dgpo
    name: null
    tags: [nersc, perlmutter, dgpo, mass-jes-grid]
